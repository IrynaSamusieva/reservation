spring.application.name=reservation-system
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/reservations
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.config.import=optional:file:./secret.env[.properties]

# Set JWT_SECRET to a random Base64-encoded 256-bit value before running the application.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

cloudflare.r2.bucket-name=images
cloudflare.r2.endpoint=https://<ACCOUNT_ID>.r2.cloudflarestorage.com
cloudflare.r2.access-key=<ACCESS_KEY_ID>
cloudflare.r2.secret-key=<SECRET_ACCESS_KEY>


